# Dairybuy Phase 4 Supabase Local Configuration
project_id = "dairybuy-phase4"

[api]
enabled = true
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.pooler]
enabled = false
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://localhost:3000", "http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 60
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[local_smtp]
enabled = true

[experimental]
stack = true
